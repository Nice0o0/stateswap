[project]
name = "stateswap"
version = "0.2.0"
description = "One RWKV-7 base model, many personas: train 6MB initial states (S0) and hot-swap them at serving time"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nice" }]
keywords = ["rwkv", "state-tuning", "llm", "inference", "persona"]
dependencies = [
    "transformers>=4.48,<6",   # 5.x 的 tied-weight 记账已适配（见 convert.py）
    "flash-linear-attention>=0.5",
    "einops",                  # fla 的 RWKV-7 实现 import 时即需要
    "safetensors",
    "fastapi>=0.110",
    "uvicorn[standard]",
    # accelerate / numpy / tqdm 零引用，已移除（此前只是声明未使用）
]

# torch 不在此声明：Windows 需要手动安装 cu128 轮子（Blackwell 必需），
# 见 README 快速上手；Linux/CI 直接 `pip install torch`（CPU 版）即可。

[project.optional-dependencies]
windows = ["triton-windows>=3.8"]
dev = ["pytest", "ruff", "httpx"]   # httpx 供 fastapi.testclient（HTTP 层测试）

[project.scripts]
stateswap = "stateswap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateswap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要 GPU 与本地模型权重的重测试（CI 上跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 演示/调试脚本刻意把 import 和 print 交错，用于展示加载顺序
"scripts/debug_triton.py" = ["E402"]
"scripts/smoke_gpu.py" = ["E402"]
"scripts/verify_live.py" = ["E402"]
