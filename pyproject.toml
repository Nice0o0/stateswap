[project]
name = "stateswap"
version = "0.1.0"
description = "One RWKV-7 base model, many personas: train 6MB initial states (S0) and hot-swap them at serving time"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nice" }]
keywords = ["rwkv", "state-tuning", "llm", "inference", "persona"]

[tool.uv]
# torch cu128 wheels are not on PyPI for Windows; installed imperatively
# (see scripts/setup_env.md) because download.pytorch.org is proxied.

[project.scripts]
stateswap = "stateswap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stateswap"]
