<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stateswap · RWKV-7 多人格状态服务</title>
  <script>
    (() => {
      const saved = localStorage.getItem("stateswap-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=0.2.3">
</head>
<body>
  <aside id="sidebar">
    <div class="logo">state<span>swap</span></div>
    <button id="btn-new-session" class="btn-new">＋ 开启新对话</button>

    <div class="side-label">会话记录</div>
    <div id="session-list"></div>

    <div class="sidebar-bottom">
      <button id="nav-mix" class="side-link">🧪 人格混合实验台</button>
      <button id="nav-train" class="side-link">🔥 训练新人格</button>
      <div class="side-row">
        <button id="btn-theme" title="切换亮/暗主题" aria-label="切换亮/暗主题">🌙</button>
        <a href="https://github.com/Nice0o0/stateswap" target="_blank" rel="noopener">GitHub ↗</a>
        <span id="server-status" class="dot-off" title="服务状态">●</span>
      </div>
    </div>
  </aside>
  <div id="backdrop"></div>

  <main>
    <section id="view-chat" class="view active">
      <header id="chat-top">
        <button id="btn-menu" class="icon-btn" aria-label="打开会话列表">☰</button>
        <select id="persona-select" title="切换人格（热切换，约 3ms）" aria-label="切换人格"></select>
        <select id="temp-preset" title="采样温度：越高越发散，越低越稳定">
          <option value="0.2">🎯 精准</option>
          <option value="0.7" selected>⚖️ 平衡</option>
          <option value="1.0">🎨 创意</option>
        </select>
        <span id="session-tag" class="muted"></span>
        <button id="btn-state" class="icon-text" title="状态监视器：每层状态范数 / 与人格 S₀ 的锚定度">🧬</button>
      </header>

      <div id="state-strip" hidden></div>

      <div id="chat-scroll">
        <div id="chat-messages"></div>
      </div>

      <div id="composer-wrap">
        <form id="composer">
          <textarea id="input" rows="1" placeholder="给 stateswap 发送消息"></textarea>
          <button id="btn-send" class="primary" type="submit" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </form>
        <div class="disclaimer">内容由 AI 生成，请注意甄别 · RWKV-7 World · S₀ 状态调优 · Enter 发送 / Shift+Enter 换行</div>
      </div>
    </section>

    <section id="view-mix" class="view">
      <div class="page">
        <a class="back" data-nav="chat">← 返回对话</a>
        <h1>人格混合实验台</h1>
        <p class="desc">S = α·A + (1−α)·B，注册为可对话的新人格。实测 S₀ 空间<strong>不可光滑插值</strong>：
          α 从 0.75 → 0.5 会发生尖锐相变（风格归零、翻译拉满）。滑动 α 亲自验证。</p>
        <div class="card">
          <div class="form-grid">
            <label>人格 A <select id="mix-a"></select></label>
            <label>人格 B <select id="mix-b"></select></label>
            <label>α（A 的权重）<input type="range" id="mix-alpha" min="0" max="1" step="0.05" value="0.5">
              <span id="mix-alpha-val" class="mono">0.50</span></label>
            <label>新人格名 <input type="text" id="mix-name" placeholder="自动生成"></label>
          </div>
          <button id="btn-mix" class="primary">混合并注册</button>
          <div id="mix-result" class="muted"></div>
        </div>
      </div>
    </section>

    <section id="view-train" class="view">
      <div class="page">
        <a class="back" data-nav="chat">← 返回对话</a>
        <h1>训练新人格</h1>
        <p class="desc">冻结底座全部权重，只训练每层 64×64 的初始状态 S₀。
          0.4B / ctx 512 约 0.2s/step，峰值显存 2GB——训练期间聊天会变慢。</p>
        <div class="card">
          <div class="form-grid">
            <label>数据集（data/*.json，{instruction, output}）<select id="train-data"></select></label>
            <label>人格名 <input type="text" id="train-name" placeholder="例如 my-persona"></label>
            <label>步数 <input type="number" id="train-steps" value="800" min="50" max="20000"></label>
            <label>学习率 <input type="text" id="train-lr" value="0.0001"></label>
            <label>上下文长度 <input type="number" id="train-ctx" value="512" min="64" max="4096"></label>
          </div>
          <button id="btn-train" class="primary">开始训练</button>
          <div id="train-progress-wrap" hidden>
            <div class="progress-track"><div id="train-progress-bar"></div></div>
            <div id="train-progress-text" class="mono muted"></div>
          </div>
          <div id="train-result" class="muted"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js?v=0.2.3"></script>
</body>
</html>
