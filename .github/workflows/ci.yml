name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch CPU 版先行安装，避免 -e . 拉取体积巨大的 CUDA 轮子
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # fla 0.5.2 的 fla/models/__init__ 无条件全量导入所有模型，链到 ops/abc
          # 顶层的 import triton——采样回归测试经由 stateswap.engine 触发这条链，
          # 所以 CPU CI 必须能 import triton（仅导入、不编译内核；CPU 轮子 torch
          # 不自带 triton，显式安装）。Windows 用户装 triton-windows，不受影响。
          pip install triton
          pip install -e .
          pip install pytest ruff

      - name: Lint
        run: ruff check src scripts tests

      # GPU / 本地权重相关的重测试标记为 slow，CI 自动跳过
      - name: Tests (CPU)
        run: pytest -m "not slow" -q
