name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch CPU 版先行安装，避免 -e . 拉取体积巨大的 CUDA 轮子
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # transformers >=5.17 把 fla 0.5.2 借 _LazyModule 实现的懒加载变成急切加载，
          # 导入 fla.models 时连带 ops/abc（顶层 import triton）——CPU runner 没有
          # triton（CPU 轮子 torch 不自带）直接炸。钉住直到 fla 修复急切导入。
          pip install "transformers<5.17"
          pip install -e .
          pip install pytest ruff

      - name: Lint
        run: ruff check src scripts tests

      # GPU / 本地权重相关的重测试标记为 slow，CI 自动跳过
      - name: Tests (CPU)
        run: pytest -m "not slow" -q
